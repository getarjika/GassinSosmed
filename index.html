<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GassinSosmed</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="page" aria-label="GassinSosmed">
  <img class="reference" src="desain-referensi.png" alt="Tampilan GassinSosmed">
  <button class="hamburger" id="hamburger" aria-label="Buka menu"></button>
  <nav class="menu" id="menu">
    <a href="#login">Masuk</a><a href="#daftar">Daftar</a>
    <a href="#harga">List Harga</a><a href="#ketentuan">Ketentuan Layanan</a>
    <a href="#kontak">Kontak Kami</a>
  </nav>
  <form class="login-overlay" id="login">
    <input class="username" aria-label="Username" placeholder="Masukkan username" autocomplete="username">
    <input class="password" id="password" aria-label="Password" type="password" placeholder="Masukkan password" autocomplete="current-password">
    <button class="toggle" id="toggle" type="button" aria-label="Tampilkan password"></button>
    <a class="forgot" href="#bantuan">Lupa Password?</a>
    <button class="submit" type="submit" aria-label="Login"></button>
    <a class="register" href="#daftar" aria-label="Daftar sekarang"></a>
  </form>
</main>
<script src="script.js"></script>
</body>
</html>
