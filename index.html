<form class="login-form" id="loginForm" autocomplete="on">
<input class="field username" name="username" aria-label="Username" placeholder="Masukkan username" autocomplete="username">
<input class="field password" id="password" name="password" type="password" aria-label="Password" placeholder="Masukkan password" autocomplete="current-password">
<button class="password-toggle" id="togglePassword" type="button" aria-label="Tampilkan atau sembunyikan password"></button>
<a class="forgot" href="#bantuan" aria-label="Lupa password?"></a>
<button class="login-submit" type="submit" aria-label="Login"></button>
<a class="register-link" href="#daftar" aria-label="Daftar sekarang"></a>
</form>
<div class="notice" id="notice">Ini masih tampilan desain. Login belum dihubungkan ke sistem akun.</div>
</main>
<script>
const menuButton=document.getElementById('menuButton');
const menu=document.getElementById('menu');
menuButton.addEventListener('click',()=>menu.classList.toggle('open'));
document.getElementById('togglePassword').addEventListener('click',()=>{
 const field=document.getElementById('password');
 field.type=field.type==='password'?'text':'password';
});
document.getElementById('loginForm').addEventListener('submit',e=>{
 e.preventDefault();
 const n=document.getElementById('notice');
 n.classList.add('show');
 setTimeout(()=>n.classList.remove('show'),3200);
});
</script>
